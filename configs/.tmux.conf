
unbind %
bind | split-window -h
bind - split-window -v

# Add Ctrl-a as a secondary prefix
#set-option -g prefix2 C-a
#bind-key C-a send-prefix -2

## easily toggle synchronization (mnemonic: e is for echo)
## sends input to all panes in a given window.
bind e setw synchronize-panes on
bind E setw synchronize-panes off

# pass through xterm keys
set -g xterm-keys on
set-window-option -g xterm-keys on

# Better colors in tmux
set -g default-terminal "tmux-256color"
# True color (RGB) disabled — causes tmux crashes over SSH on AL2023.
# Re-enable when needed: set-option -a terminal-features 'xterm-256color:RGB'

# Ctrl-K to clear scrollback
bind -n C-k clear-history

# Enable mouse mode
set -g mouse on

# Scroll History
set -g history-limit 100000

# Set ability to capture on start and restore on exit window data when running an application
setw -g alternate-screen on
# Set title-bar to top
set-option -g status-position top


# Lower escape timing from 500ms to 50ms for quicker response to scroll-buffer access.
set -s escape-time 50
 
# # Enable terminal title updates
# set-option -g set-titles on
# set -g set-titles-string "#{host}:#T #W" 
# 
# # Hide the default status bar
# set -g status on
 
# Fixes emojis not being visible in the terminal
set -gq utf8 on

# Enable focus events for neovim
set -g focus-events on

# Enable vi mode for copy mode
set-window-option -g mode-keys vi

# Clipboard integration via xclip (requires X11 forwarding with ssh -X)
# Neovim already uses clipboard=unnamedplus so it will share the same clipboard
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# Set new window to have same cwd as current pane 
bind c new-window -c "#{pane_current_path}"

# Set cursor color, or it will be invisible in agents
set -g cursor-colour white

# Position the status bar at the bottom (default behavior)
set-option -g status-position bottom

# Center the window list in the status bar
set-option -g status-justify centre

# Customize how the window list is displayed (e.g., Index:Name)
set-window-option -g window-status-format "#I:#W"
set-window-option -g window-status-current-format "#I:#W"


# ---------------------------------------------------------------------------
# Window / session navigation
# ---------------------------------------------------------------------------

# Auto-rename windows after the current foreground command. Default tmux
# behaviour, but explicit here so the pickers below show meaningful names.
# (Manual `:rename-window foo` still sticks until you clear it.)
setw -g automatic-rename on
setw -g automatic-rename-format '#{b:pane_current_command}'

# Show the running program alongside the window name in the status list.
# Comment out if you prefer the plain "#I:#W" format set above.
setw -g window-status-format         "#I:#W·#{b:pane_current_command}"
setw -g window-status-current-format "#I:#W·#{b:pane_current_command}#{?window_zoomed_flag, [Z],}"

# Toggle the status bar on/off (handy while playing with these).
bind b set -g status

# --- Style 1: tmux's built-in choose-tree pickers --------------------------
# Vim keys: j/k navigate, Enter selects, / searches, Esc cancels.
# -Z opens zoomed; -w starts on windows; -s starts on sessions.
bind w choose-tree -Zw -f '#{==:#{session_name},#{client_session}}' -F "#{?pane_format,#{pane_current_command}  #{pane_current_path},#{?window_format,#{window_index}: #{window_name} [#{?#{==:#{window_panes},1},#{pane_current_command},#{window_panes} panes}],#{session_name}}}"
bind S choose-tree -Zs

# --- Style 2: fzf inside a floating popup ----------------------------------
# Fuzzy-find windows. C-w = current session only; W = all sessions.
bind C-w display-popup -E -w 60% -h 60% \
  "tmux list-windows -F '#{window_index}: #{window_name} [#{pane_current_command}]' \
   | fzf --reverse --header='switch window (this session)' \
   | awk -F: '{print \$1}' | xargs -r tmux select-window -t"

bind W display-popup -E -w 80% -h 70% \
  "tmux list-windows -a -F '#{session_name}:#{window_index}  #{window_name}  [#{pane_current_command}]' \
   | fzf --reverse --header='switch window (all sessions)' \
   | awk '{print \$1}' | xargs -r tmux switch-client -t"

bind C-s display-popup -E -w 60% -h 60% \
  "tmux list-sessions -F '#{session_name}  (#{session_windows} windows)' \
   | fzf --reverse --header='switch session' \
   | awk '{print \$1}' | xargs -r tmux switch-client -t"

# --- Style 3: native display-menu (qmacro-style) ---------------------------
# Numeric/letter shortcuts; no fzf required. Generated dynamically.
bind M-s run-shell -b "tmux display-menu -T '##[align=centre]Sessions' -x C -y C $(tmux list-sessions -F '\"##S\" \"##S\" \"switch-client -t ##S\"' | tr '\n' ' ')"
bind M-w run-shell -b "tmux display-menu -T '##[align=centre]Windows' -x C -y C $(tmux list-windows -F '\"##I: ##W [##{pane_current_command}]\" \"##I\" \"select-window -t ##I\"' | tr '\n' ' ')"

# --- Style 4: mouse right-click on the status bar --------------------------
# Right-click anywhere on the status bar to get a quick menu. Requires the
# status bar to be on (`prefix b` toggle above, or remove `set -g status off`).
bind -n MouseDown3Status display-menu -T '#[align=centre]Quick' -t = -x M -y S \
  'Choose session'  s 'choose-tree -Zs' \
  'Choose window'   w 'choose-tree -Zw' \
  '' \
  'New session'     n 'command-prompt -p "new session:" "new-session -d -s %% ; switch-client -t %%"' \
  'Rename session'  r 'command-prompt -I "#S" "rename-session -- %%"' \
  'Rename window'   R 'command-prompt -I "#W" "rename-window -- %%"' \
  '' \
  'Detach'          d detach-client

# dotbar config
run ~/.tmux-dotbar.tmux

# dotbar recommended settings 
set-option -g renumber-windows on
set -g base-index 1
setw -g pane-base-index 1
